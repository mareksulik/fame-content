<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Evidence-based marketing prichádza na Slovensko – video 4:5</title>
  <link rel="stylesheet" href="../../system/tokens.css">
  <link rel="stylesheet" href="../../system/components.css">
  <style>
    /* Video 1080 × 1350, 8,5 s. Časovanie je iba v animation-delay; scripts/video.mjs posúva čas po snímkach.
       Scéna A 0–3,4 s: tri samolepky cez celé plátno. Scéna B 3,2–8,5 s: sticker art + tyrkysový pás s textom. */
    .scene { position: absolute; inset: 0; }

    @keyframes slap {
      0%   { opacity: 0; transform: translate(var(--x, 0), 0) scale(1.3) rotate(var(--r0)); }
      60%  { opacity: 1; transform: translate(var(--x, 0), 0) scale(.98) rotate(var(--r)); }
      100% { opacity: 1; transform: translate(var(--x, 0), 0) scale(1) rotate(var(--r)); }
    }
    @keyframes away { to { transform: translate(-130%, 0) rotate(var(--r)); } }
    @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
    @keyframes art-in { from { transform: translateX(110%) rotate(8deg); } to { transform: none; } }
    @keyframes drift { to { transform: translateX(-36px); } }
    @keyframes band-up { from { transform: translateY(100%) rotate(-3deg); } to { transform: rotate(-3deg); } }
    @keyframes hl { 0% { opacity: 0; transform: scale(1.3) rotate(-7deg); } 60% { opacity: 1; transform: scale(.98) rotate(-2deg); } 100% { opacity: 1; transform: rotate(-2deg); } }

    /* ---------- Scéna A: samolepky cez seba, vybiehajú za okraje ---------- */
    .sticker {
      position: absolute; left: -100px; width: 1280px;
      padding: 64px 140px 72px 172px; /* text na okraji plátna 72 px: −100 + 172 */
      background: var(--tone); color: var(--on-tone, var(--ink));
      font: 800 128px/0.95 var(--sans); letter-spacing: -.04em;
      animation: slap .45s cubic-bezier(.2,.8,.3,1.2) both, away .45s cubic-bezier(.6,0,.8,.4) forwards;
    }
    .s1 { --tone: var(--yellow); top: 96px; --r0: -11deg; --r: -5deg; animation-delay: .1s, 2.9s; }
    .s2 { --tone: var(--teal); top: 400px; --r0: 10deg; --r: 4deg; animation-delay: .45s, 3.0s; }
    .s3 { --tone: var(--red); --on-tone: var(--on-red); top: 700px; height: 900px; padding-block: 80px 0; font-size: 112px; line-height: 1;
          --r0: -9deg; --r: -3deg; animation-delay: .8s, 3.1s; }

    /* ---------- Scéna B: sticker art + tyrkysový pás ---------- */
    .art-wrap { position: absolute; top: -50px; left: 160px; width: 1000px; animation: art-in .6s cubic-bezier(.2,.8,.3,1.05) 3.2s both; z-index: 2; }
    .art-wrap img { display: block; width: 100%; animation: drift 4.6s linear 3.8s both; }

    .band {
      position: absolute; left: -120px; right: -120px; top: 660px; height: 900px;
      background: var(--teal);
      animation: band-up .55s cubic-bezier(.2,.8,.2,1) 3.4s both;
    }

    .copy { position: absolute; left: var(--pad); right: var(--pad); top: 760px; z-index: 3; }
    .copy p { margin: 0; font: 800 72px/1.06 var(--sans); letter-spacing: -.025em; color: var(--ink); animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
    .copy .l1 { animation-delay: 3.8s; }
    .copy .l2 { animation-delay: 4.2s; margin-top: 8px; }
    .copy .l3 { animation-delay: 4.7s; margin-top: 8px; }
    .copy .hl { display: inline-block; padding: 2px 16px 10px; background: var(--yellow); animation: hl .45s cubic-bezier(.2,.8,.3,1.2) 4.45s both; }
    .copy .f-url { margin-top: 48px; padding: 22px 40px; font-size: 44px; border-color: var(--red);
                   animation: hl .45s cubic-bezier(.2,.8,.3,1.2) 5.4s both; }
  </style>
</head>
<body>
<!-- Text: zadanie používateľa (5. 10. 2026), doslovne; prostredná scéna „FAME!“ podľa spätnej väzby vypustená. -->

  <section class="slide slide--portrait" aria-label="Evidence-based marketing prichádza na Slovensko">

    <div class="scene scene--a">
      <div class="sticker s1">Evidence-based</div>
      <div class="sticker s2">marketing</div>
      <div class="sticker s3">prichádza<br>na&nbsp;Slovensko!</div>
    </div>

    <div class="scene scene--b">
      <div class="band"></div>
      <div class="art-wrap"><img src="../../system/media/stickers-bleed.png" alt="FAME"></div>
      <div class="copy">
        <p class="l1">FAME – komunita ľudí z&nbsp;marketingu,</p>
        <p class="l2">ktorí stavajú <span class="hl">na&nbsp;vede a&nbsp;dátach,</span></p>
        <p class="l3">nie na&nbsp;trendoch a&nbsp;pocitoch.</p>
        <span class="f-url f-url--primary">fameworks.sk</span>
      </div>
    </div>

  </section>

</body>
</html>
