<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Som členom FAME – LinkedIn banner</title>
  <link rel="stylesheet" href="../../system/tokens.css">
  <link rel="stylesheet" href="../../system/components.css">
  <style>.slide--banner { width: 1584px; height: 396px; padding: 0; flex-direction: row; align-items: center; overflow: hidden; }
.slide--banner .f-tile { position: absolute; padding: 24px 40px 30px; }
.slide--banner .f-tile--yellow { left: 560px; top: 64px; }
.slide--banner .f-tile--teal { left: 860px; top: 200px; }
.slide--banner .f-logo { position: absolute; right: 64px; top: 52px; height: 120px; }
.slide--banner .f-url { position: absolute; right: 64px; bottom: 64px; }
.slide--banner .f-title { margin: 0; }</style>
</head>
<body>
  <section class="slide slide--banner" aria-label="LinkedIn banner, členom">
    <div class="f-tile f-tile--yellow"><p class="f-title">Som členom</p></div>
    <div class="f-tile f-tile--teal f-tile--cw"><p class="f-title">FAME</p></div>
    <img class="f-logo" src="../../system/brand/logo.png" alt="FAME – Friends of Applied Marketing sciencE">
    <span class="f-url f-url--primary">fameworks.sk</span>
  </section>
  <section class="slide slide--banner" aria-label="LinkedIn banner, členkou">
    <div class="f-tile f-tile--yellow"><p class="f-title">Som členkou</p></div>
    <div class="f-tile f-tile--teal f-tile--cw"><p class="f-title">FAME</p></div>
    <img class="f-logo" src="../../system/brand/logo.png" alt="FAME – Friends of Applied Marketing sciencE">
    <span class="f-url f-url--primary">fameworks.sk</span>
  </section>
</body>
</html>
